name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actions-ci:
    name: pytest-actions-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Run actions-ci tests
        run: pytest actions-ci/tests

  workspace-script:
    name: pytest-workspace-script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run workspace-script tests
        run: pytest workspace-script/tests
