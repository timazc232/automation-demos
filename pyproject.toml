[project]
name = "automation-demos"
version = "0.1.0"
description = "Small GitHub Actions + Google Workspace automation demos (not a product)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["actions-ci/tests", "workspace-script/tests"]
pythonpath = ["actions-ci", "workspace-script"]
addopts = "-q"
